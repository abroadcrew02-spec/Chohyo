# 配布物ビルド（issue #122）。
#
# main への push で走る ci.yml の full ジョブは core-dist（PyInstaller で作る
# 同梱 exe）を作らない——CI には比較対象が無いまま鮮度検査だけ足すと必ず FAIL
# するため、空のプレースホルダを置いて cargo test だけ通している（ci.yml の
# 該当ステップのコメント参照）。「CI が緑」は「配布物が最新である」ことを保証
# しない。配布する exe は、常にこのワークフローが作ったものだけを使う。手元で
# 作った core-dist を配らない（docs/release.md 参照）。
#
# トリガー: v から始まるタグの push（正式リリース）、または手動実行
# （workflow_dispatch。タグを打つ前の動作確認用）。手動実行では GitHub Release
# は作らず、ビルド成果物を Actions のアーティファクトとして保存するだけにする。
#
# ランナーは windows-latest のみ。core は Windows 専用（ci.yml 冒頭のコメント
# 参照）で、build_dist.py も `.venv\Scripts\pyinstaller.exe` を直接呼ぶ前提。
# 大型ランナー・セルフホストは公開リポジトリでも課金対象になるため使わない。

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  # リリースビルドは時間がかかる。途中で殺すと、その版の成果物も Release も
  # 中途半端なまま残る（ci.yml の push ジョブと同じ理由でキャンセルしない）。
  cancel-in-progress: false

# Windows ランナーのコンソールは cp1252 なので、build_dist.py が出す日本語の
# 起動確認ログで UnicodeEncodeError にならないよう Python の入出力を UTF-8 に固定する
# （2026-09-07 の workflow_dispatch 実行で実際に落ちた）
env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    # gh release create に contents: write が要る。既定の read から、この
    # ジョブだけを write へ引き上げる（ワークフロー既定の permissions は変えない）。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: core/pyproject.toml

      # build_dist.py は .venv\Scripts\pyinstaller.exe を直接呼ぶ（README の
      # 開発者向けセットアップと同じ形）。ci.yml の light/full ジョブはシステム
      # Python へ直接 pip install しているが、あちらは PyInstaller を使わない
      # ので venv は要らない。ここは venv が要る。
      - name: venv 作成 + Python 依存の導入（PyInstaller を含む）
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\pip install -e "core[dev]"

      # vendor/poppler/ は .gitignore 済みでリポジトリに無い。build_dist.py は
      # これが無いと「vendor/poppler が見つからない」で失敗する。ci.yml の full
      # ジョブと同じ手順（同じ URL・同じ sha256）を再利用する。
      - name: Poppler（PDF→画像）の導入
        shell: pwsh
        run: |
          $url  = 'https://github.com/oschwartz10612/poppler-windows/releases/download/v26.02.0-0/Release-26.02.0-0.zip'
          $sha  = '993e4a94376ed712fafc7058d724ea0b943d118bbd2305cd9ed55174eb85cda5'
          $zip  = Join-Path $env:RUNNER_TEMP 'poppler.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip
          $got = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $sha) { throw "poppler の sha256 が一致しない: $got" }
          New-Item -ItemType Directory -Force -Path vendor/poppler | Out-Null
          Expand-Archive -Path $zip -DestinationPath vendor/poppler -Force
          # 展開後は vendor/poppler/poppler-26.02.0/Library/bin/pdftoppm.exe。
          if (-not (Get-ChildItem -Recurse -Filter pdftoppm.exe vendor/poppler)) {
            throw 'pdftoppm.exe が見つからない'
          }

      # PyInstaller で core-dist/chouhyo-core/ を作る。build_dist.py が内部で
      # `verify --template templates/chouhyo-v1.json` を実行して起動確認する
      # （config.json の last_template が利用者テンプレートだと画面を介さない
      # 限り解決できないため、出荷テンプレートを明示で渡す既存の流儀）。成功
      # すると同時にビルド直後のソースでスタンプ（BUILD_STAMP.json）を書く。
      - name: 配布物ビルド（PyInstaller で core-dist を作る）
        shell: pwsh
        run: .venv\Scripts\python.exe scripts\build_dist.py

      # scripts/run_all_tests.py が使っている dist_stamp.check_freshness と
      # 同じ関数を単体で呼ぶ。直前のステップでスタンプを書いたばかりなので
      # 通常は PASS になるはずだが、それを workflow のログに明示して残す
      # （issue #122 の目的である「配布物がソースと同期している」ことの機械的な
      # 確認。次にこのステップが FAIL するとしたら、build_dist.py がスタンプを
      # 書いた後に同じジョブ内でソースを書き換えるステップを足したとき）。
      - name: 鮮度スタンプの検査（core-dist がソースと同期しているか確認）
        shell: bash
        run: |
          .venv/Scripts/python.exe - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          import dist_stamp
          from pathlib import Path
          status, detail = dist_stamp.check_freshness(Path("."))
          print(f"{status}: {detail}")
          sys.exit(1 if status == "FAIL" else 0)
          PY

      # サードパーティ表記（THIRD-PARTY-NOTICES.txt）が依存関係と食い違っていないか
      # を CI で確認する（issue #153）。gen_notices.py --check は Rust 側を
      # cargo-about（要インストール）で、Python 側を PyInstaller の中間生成物
      # （直前の「配布物ビルド」ステップが作る workdir_build/pyi/chouhyo-core/*.toc）
      # から読む。README の手打ちコマンドでしか実行されておらず、依存追加後に
      # 再生成を忘れても誰も気づかない状態だったため、ここで機械的に検出する。
      - name: cargo-about をキャッシュから復元
        id: cargo-about-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/cargo-about.exe
          key: cargo-about-bin-${{ runner.os }}-0.9.2

      - name: cargo-about の導入（キャッシュに無ければビルド）
        if: steps.cargo-about-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-about --version 0.9.2 --locked --features cli

      - name: サードパーティ表記の整合性チェック（gen_notices.py --check）
        run: .venv\Scripts\python.exe scripts\gen_notices.py --check

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: npm ci
        working-directory: gui
        run: npm ci

      # tauri.conf.json の beforeBuildCommand（npm run build）が tsc + vite build を
      # 先に自動で走らせる。README の開発者向け手順と同じ呼び方。bundle.resources が
      # ../../core-dist/chouhyo-core を読むので、直前のビルドステップより後に実行する
      # 必要がある。
      - name: Tauri ビルド（インストーラ生成）
        working-directory: gui
        run: npm run tauri build

      # インストーラの入手後に改竄・破損が無いか利用者が照合できるよう、
      # 配布アセットの sha256 を SHA256SUMS として同梱する（issue #159）。
      # bundle/nsis/ に置くことで、直後の upload-artifact（bundle/** を丸ごと
      # 拾う）にもこのファイルが含まれる。
      - name: SHA256SUMS を作成（配布物の検証用）
        shell: pwsh
        run: |
          $dir = 'gui/src-tauri/target/release/bundle/nsis'
          $files = Get-ChildItem -Path $dir -Filter *.exe
          if (-not $files) { throw "$dir に exe が無い" }
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($f.Name)"
          }
          $out = Join-Path $dir 'SHA256SUMS'
          # BOM 無し・LF 固定。sha256sum 標準形式（ハッシュ・空白2つ・ファイル名）で
          # 書けば、Windows でも `CertUtil -hashfile <exe> SHA256` や
          # `Get-FileHash` の出力とそのまま突き合わせられる。
          [System.IO.File]::WriteAllText($out, ($lines -join "`n") + "`n")
          Get-Content $out

      - name: ビルド成果物をアーティファクトとして保存
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chouhyo-ocr-installer-${{ github.ref_name }}
          path: gui/src-tauri/target/release/bundle/**
          if-no-files-found: error

      # タグ push のときだけ GitHub Release を作る。workflow_dispatch は動作確認用の
      # ビルドで、上のアーティファクト保存だけで完結させる（Release は作らない）。
      # softprops/action-gh-release 等のサードパーティ action は使わず、ランナーに
      # 同梱済みの gh CLI と既定の GITHUB_TOKEN（このジョブだけ contents: write）で足りる。
      #
      # タグ名は env 経由で渡す（issue #159）。以前は "${{ github.ref_name }}" を
      # run: シェルへ直接展開しており、git check-ref-format が許す `$`・
      # バッククォート・`(` `)` 等をタグ名に含めて push できれば、二重引用符では
      # 止まらないコマンド置換が push 権限を持つ人からリリーストークンでの
      # 任意コード実行へ繋がりうる状態だった。guard.yml:54-55 と同じ手法
      # （env → シェル変数）に揃える。
      - name: GitHub Release へ添付
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            gui/src-tauri/target/release/bundle/nsis/*.exe \
            gui/src-tauri/target/release/bundle/nsis/SHA256SUMS \
            --title "$TAG" \
            --generate-notes
