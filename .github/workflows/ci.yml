# 回帰ゲートを GitHub 側でも回す（issue #95）。
#
# 手元の `scripts/run_all_tests.py` は「忘れずに打つ人」に依存している。ここで
# 強制するが、PR ごとにフルスイートを回すと 1 回 15〜30 分かかり待ち時間が
# 積み上がるので、役割を分ける。
#
#   pull_request → light（ubuntu-latest）: 型検査・GUI 純ロジック・依存宣言の解決
#   push (main)  → full （windows-latest）: pytest 全体・GUI スモーク（Playwright）・
#                  GUI 純ロジック・cargo test・cargo deny
#
# ランナーは標準の ubuntu-latest / windows-latest だけを使う。大型ランナー
# （ubuntu-latest-4-cores 等）とセルフホストは公開リポジトリでも課金対象になる
# ため書かない。
#
# フルスイートを OS で割る案（pytest だけ ubuntu）は採らない。core は Windows
# 専用で、core/chouhyo_ocr/cred_store.py が `import ctypes.wintypes` を持ち
# （Linux では import 自体が失敗する）、cli.py がそれを読み込む。加えて
# core/tests の 6 ファイルが `.venv/Scripts/python.exe` を直接起動し、
# test_response_robustness.py は msvcrt のファイルロックを使う。ubuntu へ
# 割るには core/tests 側の改修が要る（2026-09-03 調査）。

name: ci

on:
  # 二重に走らせない。push は main に入った後のフル、pull_request はマージ前の軽量。
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # push では前の run を殺さない。main へ連続 push したとき前の run が kill
  # されると、その差分に対するフルスイートの結果が残らない（セキュリティ担当 H-4 と同型）。
  # PR は最新版だけ見れば足りるので殺してよい。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # PR ごと。数分で終わる範囲だけを見る。
  # ---------------------------------------------------------------
  light:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: npm ci
        working-directory: gui
        run: npm ci

      # gui-logic テストは esbuild で型注釈を剥がすだけで型を見ない。型検査は
      # ここが唯一の関門になる（配布物ビルドまで待たない・issue #95）。
      - name: 型検査（tsc --noEmit）
        working-directory: gui
        run: ./node_modules/.bin/tsc --noEmit -p .

      - name: GUI 純ロジック
        working-directory: gui
        run: node tests/gui-logic.test.mjs

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      # 宣言だけを検査する。import はしない——core は Windows 専用のため
      # ubuntu では読み込めない（先頭のコメント参照）。依存の解決が壊れたら
      # ここで落ちる（issue #94）。
      - name: Python 依存の宣言が解決できるか
        run: python -m pip install -e "core[dev]"

  # ---------------------------------------------------------------
  # main へ入った後。フルスイート。
  # ---------------------------------------------------------------
  full:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: core/pyproject.toml

      - name: Python 依存の導入
        run: python -m pip install -e "core[dev]"

      # vendor/poppler/ は .gitignore 済みでリポジトリに無い。無いまま pytest を
      # 回すと ingest が POPPLER_NOT_FOUND を投げ、PDF 展開まわりのテストが
      # skip ではなく失敗する。手元と同じ 26.02.0 を入れる。
      # ダウンロードは sha256 を照合してから展開する（差し替えを検知する）。
      - name: Poppler（PDF→画像）の導入
        shell: pwsh
        run: |
          $url  = 'https://github.com/oschwartz10612/poppler-windows/releases/download/v26.02.0-0/Release-26.02.0-0.zip'
          $sha  = '993e4a94376ed712fafc7058d724ea0b943d118bbd2305cd9ed55174eb85cda5'
          $zip  = Join-Path $env:RUNNER_TEMP 'poppler.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip
          $got = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $sha) { throw "poppler の sha256 が一致しない: $got" }
          New-Item -ItemType Directory -Force -Path vendor/poppler | Out-Null
          Expand-Archive -Path $zip -DestinationPath vendor/poppler -Force
          # 展開後は vendor/poppler/poppler-26.02.0/Library/bin/pdftoppm.exe。
          # ingest.py が vendor/poppler/**/pdftoppm.exe を glob で探す形に合わせる。
          if (-not (Get-ChildItem -Recurse -Filter pdftoppm.exe vendor/poppler)) {
            throw 'pdftoppm.exe が見つからない'
          }

      # run_all_tests.py ではなく pytest を直接呼ぶ。ランナーは「skip が passed の
      # 10% を超えたら FAIL」というガードを持つが、テストの約 38% は .gitignore 済みの
      # workdir/pages/sample-1.png・workdir/s2/resp_*.json を素材にしており、CI には
      # その素材が無い。ランナーをそのまま呼ぶと必ず FAIL になるため、CI では
      # 「skip は許すが failed は 0」を判定にする。skip 件数は -rs でログに出す。
      # 合成の検証画像 formC-1.png は生成物で追跡していない（testdata/formC/README.md）。
      # 無いと detect-frames / 様式判定のテストが skip になるので、pytest の前に作る
      - name: formC を生成
        run: python -X utf8 testdata/formC/make_formC.py
      # test_gui_smoke.py（core/tests/test_gui_smoke.py）はここでは除外する。vite dev
      # サーバーがまだ無いため import 時の skipif で必ず skip になり、ここに含めても
      # 検証にならない（issue #139）。実行は後段の専用ステップで行う。
      - name: pytest
        working-directory: core
        run: python -X utf8 -m pytest -q --tb=short -rf -rs -n auto --ignore=tests/test_gui_smoke.py

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: npm ci
        working-directory: gui
        run: npm ci

      # --- GUI スモーク（issue #139） --------------------------------------
      # core/tests/test_gui_smoke.py は vite dev サーバー（tauri dev が使う
      # http://localhost:1420）を素の Chromium で開き、bridge.ts のデモモック
      # 経由で画面遷移とサマリ表示を検証する。Tauri の webview（gui.exe）は
      # 使わない——デスクトップアプリの起動やネイティブ側の配線は検証しない、
      # ブラウザで確認できる範囲（UI の配線）に限定したスモークとして CI に足す。
      - name: Playwright ブラウザをキャッシュから復元
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('core/pyproject.toml') }}

      # full ジョブは venv を作らず system Python へ直接 core[dev] を入れている
      # （release.yml と違い venv 化していない・このジョブの「Python 依存の導入」
      # ステップ参照）。python は PATH 上のもの（setup-python 導入）を使う。
      - name: Playwright（Chromium）の導入
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium

      # 起動・待ち合わせ・スモーク・停止を 1 ステップにまとめる。別ステップで
      # Start-Process した cmd.exe → npm → vite のツリーは、そのステップが終わると
      # 次のステップの netstat に 1420 が現れず（run 34201625141・34202883093・
      # 2026-09-08。vite のログには ready と http://localhost:1420/ が出ていた）、
      # 待ち合わせが 90 秒待ち切って落ちた。同じステップの中なら生き続ける。
      #
      # 待ち合わせは [::1]・127.0.0.1・localhost の順に叩く——vite（Node 17 以降）は
      # localhost を IPv6 の [::1] に解決してそこだけで待ち受けることがあり、
      # pwsh が localhost を 127.0.0.1 に解決すると接続拒否になる。ブラウザ
      # （Chromium）は両方を試すのでスモーク側の URL は localhost のままでよい。
      #
      # pytest は -n auto を使わない（逐次実行）。この1ファイルはモジュール
      # スコープの page フィクスチャ（同一ブラウザページ）をテスト間で共有して
      # おり、xdist のワーカー分散でテストがばらけるとフィクスチャがワーカー
      # ごとに作り直され、状態を積み上げていく前提の検証が壊れる（issue #139）。
      # 件数の正本は 03 §3。
      - name: GUI スモーク（vite dev を起動 → 待ち合わせ → pytest → 停止・issue #139）
        shell: pwsh
        run: |
          function Stop-Tree([int]$procId) {
            Get-CimInstance Win32_Process -Filter "ParentProcessId = $procId" -ErrorAction SilentlyContinue |
              ForEach-Object { Stop-Tree $_.ProcessId }
            Stop-Process -Id $procId -Force -ErrorAction SilentlyContinue
          }
          $log = Join-Path $env:RUNNER_TEMP 'vite-dev.log'
          $p = Start-Process -FilePath 'cmd.exe' -ArgumentList '/c', 'npm run dev' `
            -WorkingDirectory (Join-Path $PWD 'gui') `
            -RedirectStandardOutput $log -RedirectStandardError "$log.err" -PassThru -NoNewWindow
          try {
            $deadline = (Get-Date).AddSeconds(90)
            $up = $null
            $urls = @('http://[::1]:1420/', 'http://127.0.0.1:1420/', 'http://localhost:1420/')
            while ((Get-Date) -lt $deadline -and -not $up) {
              if ($p.HasExited) { break }
              foreach ($u in $urls) {
                try {
                  $resp = Invoke-WebRequest -Uri $u -UseBasicParsing -TimeoutSec 2
                  if ($resp.StatusCode -eq 200) { $up = $u; break }
                } catch {}
              }
              if (-not $up) { Start-Sleep -Seconds 2 }
            }
            if (-not $up) {
              Write-Host "--- vite-dev.log（プロセス終了済み: $($p.HasExited)）---"
              Get-Content $log -ErrorAction SilentlyContinue
              Write-Host '--- vite-dev.log.err ---'
              Get-Content "$log.err" -ErrorAction SilentlyContinue
              Write-Host '--- netstat :1420 ---'
              netstat -ano | Select-String ':1420'
              throw 'vite dev サーバーが 90 秒以内に応答しなかった'
            }
            Write-Host "vite dev サーバー起動確認（$up）"
            Push-Location core
            try {
              python -X utf8 -m pytest tests/test_gui_smoke.py -q -p no:randomly --tb=short -rf -rs
              if ($LASTEXITCODE -ne 0) { throw "GUI スモークが失敗した（exit $LASTEXITCODE）" }
            } finally { Pop-Location }
          } finally {
            # cmd.exe 経由の npm run dev は子の node（vite）を別 PID で持つので
            # ツリーごと止め、1420 を掴んでいるプロセスも合わせて止める
            # （ベストエフォート。ランナーはこのジョブの直後に破棄される）。
            # taskkill を使わないのは、その終了コードが $LASTEXITCODE に残って
            # ステップの成否に混ざるのを避けるため
            if (-not $p.HasExited) { Stop-Tree $p.Id }
            try {
              Get-NetTCPConnection -LocalPort 1420 -State Listen -ErrorAction Stop |
                Select-Object -ExpandProperty OwningProcess -Unique |
                ForEach-Object { Stop-Process -Id $_ -Force -ErrorAction SilentlyContinue }
            } catch {}
          }
      # --- GUI スモークここまで ---------------------------------------------

      # tsc && vite build。型検査を兼ねるうえ、gui/dist を作る——tauri-build が
      # tauri.conf.json の frontendDist（../dist）を要求するため、これが無いと
      # 次の cargo test がビルドで落ちる。
      - name: フロントエンドのビルド（型検査を含む）
        working-directory: gui
        run: npm run build

      - name: GUI 純ロジック
        working-directory: gui
        run: node tests/gui-logic.test.mjs

      # cargo は windows-latest に同梱済み。rustup のツールチェーンを足す
      # サードパーティ action は入れない（供給網を増やさない）。
      # 取得済みクレートだけをキャッシュする。target/ は載せない——復元した
      # ビルド成果物は次の cargo 実行でそのまま使われ、build.rs や
      # プロシージャマクロは実行されるコードなので、汚染された成果物が
      # 復元されると実行経路になる（セキュリティ担当 M-6）。registry/git は取得物の
      # 保管で、Cargo.lock のハッシュ照合を経てから使われる。
      - name: 取得済みクレートをキャッシュ
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('gui/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # 依存のライセンスと既知の脆弱性を CI で自動点検する（issue #153）。
      # deny.toml は既に用意されている（許可ライセンス・yanked=deny 等）が、
      # これまで README の手打ちコマンドでしか実行されておらず、CI には無かった。
      # ツール本体（cargo-deny バイナリ）は crates.io からビルドする——
      # サードパーティ action は増やさない（供給網を増やさない方針）。
      # ~/.cargo/bin は上のクレートキャッシュ（registry/git）とは別物なので
      # 専用キャッシュを持つ。バージョンを固定し、更新するときはこのキーも変える。
      - name: cargo-deny をキャッシュから復元
        id: cargo-deny-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/cargo-deny.exe
          key: cargo-deny-bin-${{ runner.os }}-0.20.2

      - name: cargo-deny の導入（キャッシュに無ければビルド）
        if: steps.cargo-deny-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: cargo deny check（ライセンス・脆弱性アドバイザリ）
        working-directory: gui/src-tauri
        run: cargo deny check

      # tauri-build（build.rs）は tauri.conf.json の bundle.resources に書いたパスの存在を
      # 検査する。同梱 exe（core-dist/・gitignore 済み・PyInstaller で作る）は CI に無いので
      # 空のフォルダを置いて通す。cargo test が検査するのは Rust 側のロジックだけで、
      # 同梱物の中身は使わない（2026-09-04 の初回 CI で `resource path doesn't exist` を実測）
      - name: 同梱 exe のプレースホルダ（tauri-build の存在検査用）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path core-dist/chouhyo-core | Out-Null
          Set-Content -Path core-dist/chouhyo-core/CI_PLACEHOLDER.txt -Value 'CI では同梱 exe を作らない（build_dist.py はリリース手順で実行する）'
      - name: cargo test
        working-directory: gui/src-tauri
        run: cargo test --quiet

      # core-dist（同梱 exe）の鮮度検査は CI では行わない。core-dist/ は
      # .gitignore 済みでリポジトリに無く、CI で作っても比較相手が無い。
      # 配布前の確認は手元の run_all_tests.py が担う。
      # 配布は release.yml が作る成果物のみを使う（タグ push または手動実行）。
